<!-- backend/templates/reset_password.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset Password — Nova News</title>
</head>
<body>
  <div id="app">
    <h1>Reset your NovaNews password</h1>
    <input id="pw" type="password" placeholder="New password" />
    <button id="btn">Update Password</button>
    <p id="msg"></p>
  </div>
  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
    const supabase = createClient("{{ SUPABASE_URL }}", "{{ SUPABASE_ANON_KEY }}");

    // 1) Exchange the link for a session
    const { data: exchangeData, error: exchangeError } =
      await supabase.auth.exchangeCodeForSession(window.location.href);

    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    btn.onclick = async () => {
      const pwInput = document.getElementById('pw');
      const newPw = pwInput.value;

      msg.textContent = 'Updating...';

      const { error } = await supabase.auth.updateUser({ password: newPw });
      if (error) {
        msg.textContent = 'Failed: ' + (error.message || 'Unknown error');
      } else {
        msg.textContent = 'Password updated. You can close this page and log in.';
      }
    };
  </script>
</body>
</html>
