<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Reset Your Password</h1>
  <div id="status">Verifying link...</div>

  <div id="form" style="display:none;">
    <input type="password" id="password" placeholder="New password" /><br/><br/>
    <input type="password" id="confirm" placeholder="Confirm new password" /><br/><br/>
    <button id="submit">Update Password</button>
  </div>

  <script>
    const url = new URL(window.location.href);
    const code = url.searchParams.get("code") || url.searchParams.get("token") || url.searchParams.get("token_hash");
    const statusEl = document.getElementById("status");
    const formEl = document.getElementById("form");

    const supabase = supabase.createClient("{{ SUPABASE_URL }}", "{{ SUPABASE_ANON_KEY }}");

    if (!code) {
      statusEl.innerText = "Missing token in URL.";
    } else {
      (async () => {
        const fullUrl = window.location.href;
        const { data, error } = await supabase.auth.exchangeCodeForSession(fullUrl);
        if (error) {
          statusEl.innerText = "Invalid or expired link: " + error.message;
        } else {
          statusEl.innerText = "Link verified. Enter your new password:";
          formEl.style.display = "block";
        }
      })();
    }

    document.getElementById("submit").onclick = async () => {
      const pwd = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;
      if (pwd !== confirm) {
        alert("Passwords do not match.");
        return;
      }
      const { error } = await supabase.auth.updateUser({ password: pwd });
      if (error) {
        alert("Error: " + error.message);
      } else {
        statusEl.innerText = "Password updated successfully. You can now log in.";
        formEl.style.display = "none";
      }
    };
  </script>
</body>
</html>
