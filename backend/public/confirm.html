<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova News — Account Confirmed</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #fafafa;
      color: #333;
    }
    .card {
      background: #fff;
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .checkmark {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: inline-block;
      border: 4px solid #34c759;
      position: relative;
      animation: pop 0.4s ease-out forwards;
    }
    .checkmark::after {
      content: '';
      position: absolute;
      left: 18px;
      top: 32px;
      width: 18px;
      height: 32px;
      border-right: 4px solid #34c759;
      border-bottom: 4px solid #34c759;
      transform: rotate(45deg) scale(0);
      animation: draw 0.4s 0.3s ease-out forwards;
    }
    @keyframes pop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes draw {
      to { transform: rotate(45deg) scale(1); }
    }
    h1 {
      font-size: 1.6rem;
      margin: 1.2rem 0 0.6rem;
    }
    p {
      font-size: 1rem;
      color: #555;
      margin-bottom: 1.5rem;
    }
    a.button {
      display: inline-block;
      background-color: #007aff;
      color: white;
      text-decoration: none;
      padding: 0.7rem 1.5rem;
      border-radius: 0.6rem;
      font-weight: 500;
      transition: background 0.2s;
    }
    a.button:hover {
      background-color: #0059d6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="checkmark"></div>
    <h1>Account Confirmed</h1>
    <p>Your Nova News account has been successfully verified. You can now open the app and log in.</p>
  </div>
</body>
</html>
