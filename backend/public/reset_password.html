<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Reset Password — Nova News</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:#fafafa; color:#333; margin:0; min-height:100vh;
      display:flex; align-items:center; justify-content:center;
    }
    .card {
      width: 92%; max-width: 420px; background:#fff; padding: 2rem;
      border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.06); text-align:center;
    }
    h1 { font-size: 1.4rem; margin: 0 0 1rem; }
    .field { display:flex; gap:.5rem; margin: 1rem 0; }
    input[type="password"] {
      flex:1; padding:.75rem .9rem; border:1px solid #ddd; border-radius:.6rem; font-size:1rem;
    }
    button {
      padding:.75rem 1.1rem; border:0; border-radius:.6rem; font-weight:600;
      background:#007aff; color:#fff; cursor:pointer;
    }
    button[disabled] { opacity:.6; cursor:not-allowed; }
    #msg { margin-top: .75rem; font-size:.95rem; color:#555; min-height:1.25rem; }
    .ok { color:#1a7f37; }
    .err { color:#b00020; }
    .hint { font-size:.85rem; color:#666; margin-top:.25rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Reset your Nova News password</h1>
    <div class="field">
      <input id="pw" type="password" placeholder="New password" autocomplete="new-password" />
      <button id="btn">Update Password</button>
    </div>
    <div id="msg"></div>
    <div class="hint">If this link says it’s expired, request a new reset email.</div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // 🔧 IMPORTANT: replace these with your real values (same project that sent the email)
    const SUPABASE_URL = "https://rnluzbkdsqldishirwrc.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_z5nWDnBaJptPhgTw7GOlHg_oDDlSKFS";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    const pwInput = document.getElementById('pw');

    function setMessage(text, kind) {
      msg.textContent = text || "";
      msg.className = kind || "";
    }

    function getHashParams() {
      const raw = window.location.hash ? window.location.hash.slice(1) : "";
      return new URLSearchParams(raw);
    }

    async function ensureSessionFromUrl() {
      // Case 1: recovery links with #access_token & #refresh_token
      const hash = getHashParams();
      const accessToken = hash.get('access_token');
      const refreshToken = hash.get('refresh_token');
      if (accessToken && refreshToken) {
        const { error } = await supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });
        if (error) throw error;
        // Clean the URL so tokens aren’t left in the bar
        try { history.replaceState(null, "", "/reset-password"); } catch (_) {}
        return true;
      }

      // Case 2: magic link / PKCE (?code=)
      const hasQuery = window.location.search && window.location.search.includes("code=");
      if (hasQuery) {
        const { error } = await supabase.auth.exchangeCodeForSession(window.location.href);
        if (error) throw error;
        return true;
      }
      return false;
    }

    // If Supabase sent an error in the URL fragment (e.g., otp_expired), show it nicely
    function showOtpErrorIfPresent() {
      const hash = getHashParams();
      const error = hash.get('error');
      const code = hash.get('error_code');
      const desc = hash.get('error_description');
      if (error || code) {
        setMessage(desc || "This link is invalid or has expired. Please request a new reset email.", "err");
        return true;
      }
      return false;
    }

    // On load: try to establish a session from the URL
    (async () => {
      try {
        if (showOtpErrorIfPresent()) return;
        const gotSession = await ensureSessionFromUrl();
        if (!gotSession) {
          // Not necessarily an error; user might already be signed in or link was opened in a way that stripped tokens
          const { data } = await supabase.auth.getUser();
          if (!data?.user) {
            setMessage("Missing or expired reset token. Request a new reset email.", "err");
          }
        }
      } catch (e) {
        console.error("Session bootstrap failed:", e);
        setMessage("Link invalid or expired. Request a new reset email.", "err");
      }
    })();

    btn.addEventListener('click', async () => {
      const newPw = (pwInput.value || "").trim();
      if (!newPw) {
        setMessage("Please enter a new password.", "err");
        return;
      }
      setMessage("Updating…");
      btn.disabled = true;
      try {
        // Ensure we still have a session before updating
        const { data: userData } = await supabase.auth.getUser();
        if (!userData?.user) {
          setMessage("Your reset session is missing or expired. Request a new reset email.", "err");
          return;
        }
        const { error } = await supabase.auth.updateUser({ password: newPw });
        if (error) {
          console.error("updateUser error:", error);
          setMessage(error.message || "Failed to update password.", "err");
          return;
        }
        setMessage("Password updated. You can open the app and sign in.", "ok");
      } catch (e) {
        console.error(e);
        setMessage("Unexpected error. Please try again.", "err");
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
