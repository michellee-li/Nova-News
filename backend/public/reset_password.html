<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaNews — Reset Password</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f2f2f7;
        color: #1c1c1e;
      }

      .container {
        background: #fff;
        padding: 2rem;
        border-radius: 16px;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
        text-align: center;
        max-width: 420px;
        width: 90%;
      }

      .logo {
        width: 48px;
        height: 48px;
        margin-bottom: 12px;
        border-radius: 12px;
      }

      h2 {
        margin: 0 0 8px;
        font-weight: 600;
      }

      p {
        font-size: 14px;
        color: #555;
        margin-top: 0;
        margin-bottom: 18px;
      }

      input {
        width: 100%;
        padding: 12px;
        margin: 10px 0 20px 0;
        border-radius: 10px;
        border: 1px solid #ccc;
        font-size: 15px;
      }

      button {
        display: block;
        margin: 0 auto;
        width: 65%;
        padding: 12px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(135deg, #007aff, #0a84ff);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }

      button:hover {
        opacity: 0.9;
      }

      .msg {
        margin-top: 18px;
        font-size: 14px;
      }

      .ok {
        color: #28a745;
      }

      .err {
        color: #d93025;
      }

      .support {
        margin-top: 24px;
        font-size: 13px;
        color: #555;
      }

      .support a {
        color: #007aff;
        text-decoration: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        src="https://nova-news.onrender.com/logo.png"
        alt="NovaNews Logo"
        class="logo"
      />
      <h2>Reset your password</h2>
      <p>Choose a new password for your NovaNews account.</p>

      <input
        id="new-password"
        type="password"
        placeholder="New password"
      />
      <button id="update-password">Update Password</button>
      <div id="message" class="msg"></div>

      <div class="support">
        Need help? 
        <a href="https://nova-news.onrender.com/support">Contact NovaNews Support</a>
      </div>
    </div>

    <!-- Load Supabase client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/javascript">
      const SUPABASE_URL = "https://your-project-id.supabase.co";
      const SUPABASE_ANON_KEY = "your-anon-key";
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const messageEl = document.getElementById("message");
      const newPwEl = document.getElementById("new-password");
      const btn = document.getElementById("update-password");

      function setMessage(text, type = "ok") {
        messageEl.textContent = text;
        messageEl.className = "msg " + type;
      }

      // Safely establish a Supabase session from the recovery link
      async function ensureSessionFromUrl() {
        const url = new URL(window.location.href);
        if (url.searchParams.get("code")) {
          await supabase.auth.exchangeCodeForSession(window.location.href);
        } else if (location.hash.includes("access_token")) {
          const params = new URLSearchParams(location.hash.slice(1));
          const access_token = params.get("access_token");
          const refresh_token = params.get("refresh_token");
          if (access_token && refresh_token) {
            await supabase.auth.setSession({ access_token, refresh_token });
          }
        }
        history.replaceState(null, "", window.location.pathname);
      }

      (async () => {
        try {
          await ensureSessionFromUrl();
        } catch (e) {
          console.error("Session hydration failed:", e);
        }
      })();

      // Handle password update
      btn.addEventListener("click", async () => {
        const newPw = newPwEl.value.trim();
        if (!newPw) {
          setMessage("Please enter a new password.", "err");
          return;
        }

        try {
          let { data: userData } = await supabase.auth.getUser();
          if (!userData?.user) {
            await ensureSessionFromUrl();
            userData = (await supabase.auth.getUser()).data;
          }

          if (!userData?.user) {
            setMessage("Reset link is invalid or expired. Request a new one.", "err");
            return;
          }

          const { error } = await supabase.auth.updateUser({ password: newPw });
          if (error) {
            setMessage(error.message, "err");
          } else {
            setMessage("✅ Password updated successfully. You can sign in now.", "ok");
            await supabase.auth.signOut();
          }
        } catch (err) {
          console.error(err);
          setMessage("Something went wrong. Please try again.", "err");
        }
      });
    </script>
  </body>
</html>
