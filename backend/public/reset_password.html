<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // If you render these via FastAPI template vars, keep the {{ ... }}.
  // If this file is purely static, hardcode your values.
  const SUPABASE_URL = "{{ SUPABASE_URL }}";
  const SUPABASE_ANON_KEY = "{{ SUPABASE_ANON_KEY }}";

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const msg = document.getElementById('msg');
  const btn = document.getElementById('btn');
  const pwInput = document.getElementById('pw');

  // Parse hash params like #access_token=...&refresh_token=...&type=recovery
  function getHashParams() {
    const hash = window.location.hash?.slice(1) || "";
    return new URLSearchParams(hash);
  }

  async function ensureSessionFromUrl() {
    // 1) Recovery flow (fragment tokens)
    const hash = getHashParams();
    const accessToken = hash.get('access_token');
    const refreshToken = hash.get('refresh_token');
    if (accessToken && refreshToken) {
      const { error } = await supabase.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken
      });
      if (error) throw error;

      // Clean the URL (remove tokens from the bar)
      try { history.replaceState(null, "", "/reset-password"); } catch (_) {}
      return;
    }

    // 2) Magic link / PKCE flow (?code=...)
    try {
      const { error } = await supabase.auth.exchangeCodeForSession(window.location.href);
      if (error) {
        // It's okay if there is no code; user might already be authed.
        console.debug("exchangeCodeForSession:", error.message);
      }
    } catch (e) {
      console.debug("exchangeCodeForSession exception:", e?.message || e);
    }
  }

  // Set session if needed as soon as page loads
  (async () => {
    try {
      await ensureSessionFromUrl();
    } catch (e) {
      console.error("Failed to set session from URL:", e);
      msg.textContent = "Link invalid or expired. Request a new reset email.";
    }
  })();

  btn.onclick = async () => {
    const newPw = pwInput.value?.trim();
    if (!newPw) {
      msg.textContent = "Please enter a new password.";
      return;
    }
    msg.textContent = "Updating...";
    const { error } = await supabase.auth.updateUser({ password: newPw });
    if (error) {
      console.error("updateUser error:", error);
      msg.textContent = "Failed to update password: " + (error.message || "Unknown error");
      return;
    }
    msg.textContent = "Password updated. You can now open the app and sign in.";
  };
</script>
