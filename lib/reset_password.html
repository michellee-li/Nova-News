<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding: 24px; max-width: 480px; margin: 0 auto; }
    .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .row { margin-bottom: 12px; }
    input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; }
    button { padding: 10px 14px; border: 0; border-radius: 8px; background: #111827; color: #fff; cursor: pointer; }
    .ok { color: #065f46; }
    .err { color: #991b1b; }
    .muted { color: #6b7280; font-size: 14px; }
  </style>
  <!-- Supabase JS (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Reset your password</h1>
  <div id="status" class="muted">Preparing…</div>

  <div id="form" class="card" style="display:none;">
    <div class="row">
      <label for="pwd">New password</label><br/>
      <input id="pwd" type="password" autocomplete="new-password" />
    </div>
    <div class="row">
      <label for="pwd2">Confirm new password</label><br/>
      <input id="pwd2" type="password" autocomplete="new-password" />
    </div>
    <button id="submit">Update password</button>
  </div>

  <script>
    (async () => {
      const SUPABASE_URL = "{{ SUPABASE_URL if SUPABASE_URL else '' }}";
      const SUPABASE_ANON_KEY = "{{ SUPABASE_ANON_KEY if SUPABASE_ANON_KEY else '' }}";

      if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
        document.getElementById('status').className = 'err';
        document.getElementById('status').textContent =
          'Server missing Supabase env. Ask the administrator to set SUPABASE_URL and SUPABASE_ANON_KEY.';
        return;
      }

      const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      // Normalize query: Supabase sometimes sends ?code=..., older flows use ?token or ?token_hash
      const url = new URL(window.location.href);
      const qp = url.searchParams;
      if (!qp.get('code')) {
        const legacy = qp.get('token') || qp.get('token_hash');
        if (legacy) {
          qp.set('code', legacy);
          qp.delete('token');
          qp.delete('token_hash');
          // update the URL (no reload)
          window.history.replaceState({}, '', url.toString());
        }
      }

      document.getElementById('status').textContent = 'Verifying link…';

      // Exchange the code in the URL for a session
      const { data, error } = await client.auth.exchangeCodeForSession(window.location.href);
      if (error) {
        document.getElementById('status').className = 'err';
        document.getElementById('status').textContent = 'Invalid or expired link: ' + (error.message || error);
        return;
      }

      document.getElementById('status').className = 'ok';
      document.getElementById('status').textContent = 'Link verified. Enter a new password.';
      document.getElementById('form').style.display = 'block';

      document.getElementById('submit').addEventListener('click', async () => {
        const pwd = document.getElementById('pwd').value.trim();
        const pwd2 = document.getElementById('pwd2').value.trim();
        if (!pwd || !pwd2) {
          alert('Please enter the password twice.');
          return;
        }
        if (pwd !== pwd2) {
          alert('Passwords do not match.');
          return;
        }
        const { error: updErr } = await client.auth.updateUser({ password: pwd });
        if (updErr) {
          alert('Update failed: ' + (updErr.message || updErr));
          return;
        }
        document.getElementById('status').className = 'ok';
        document.getElementById('status').textContent = 'Password updated. You can close this page and log in.';
        document.getElementById('form').style.display = 'none';
      });
    })();
  </script>
</body>
</html>
